# =============================================================================
#  待办清单 · nginx 站点配置片段
# -----------------------------------------------------------------------------
#  用法：把下面这些段粘进 1Panel 的「伪静态」配置
#        （网站 → 站点目录 → 伪静态，即 /www/sites/<站点>/rewrite/<站点>.conf）。
#        该文件是被 include 进 server{} 的，所以里面可以写 location 与 rewrite。
#
#  规则与 .htaccess、router.php、lib/core.php 一一对应：
#
#     /                                 → index.php
#     /tracked/ /planned/ /done/ /all/ → index.php?tab=<tab>
#     /tracked/task/12/                 → index.php?tab=tracked&task=12
#     /tracked/task/12/2026-10-24/      → index.php?tab=tracked&task=12&date=2026-10-24
#     /admin/                           → admin.php?view=tasks
#     /admin/tasks/12/                  → admin.php?view=tasks&edit=12
#     /login/  /logout/  /action/       → login.php / logout.php / action.php
#
#  站点里还要有 PHP 的 location（面板一般已经配好）：
#     location ~ \.php$ { fastcgi_pass ...; }
#
#  ---------------------------------------------------------------------------
#  两个 nginx 特有的坑（都踩过）：
#
#  1. 正则里有 { } 必须加引号。nginx 的配置解析器把 { 当成「配置块开始」，
#     不加引号的话 (\d{4}-\d{2}-\d{2}) 会被截断成 (\d，直接报
#         pcre2_compile() failed: missing closing parenthesis
#     所以下面所有正则都加了引号，并且用 [0-9] 代替 \d，
#     免得引号里的转义规则再添乱。
#
#  2. rewrite 里重新写一遍正则。location 的捕获组不保证能直接用在 rewrite 的
#     替换串里，自己再捕获一次最稳妥（下面的 rewrite 都带了完整正则）。
#
#  另外：这份片段假设站点在域名根目录。装在子目录（/todo/）的话，
#  每个 location 的前缀都要补上 /todo。
# =============================================================================

# --- 屏蔽敏感路径 -----------------------------------------------------------
# data/ 是运行时数据：SQLite 库（含 -wal / -shm）。
location = /data                { deny all; }
location ^~ /data/              { deny all; }
location ^~ /lib/               { deny all; }
location = /config.php          { deny all; }
location ~* "[.](sqlite|sqlite-wal|sqlite-shm|db|log|ini|bak|sql|json)$" { deny all; }
location ~ "/[.](?!well-known)[^/]*" { deny all; }

# --- 伪静态 -----------------------------------------------------------------
# 根目录交给 index.php。
# 这里必须用 rewrite（或 index），**不能用 try_files /index.php**：
# try_files 命中文件后不重新选 location，而是拿当前 location 的 content handler
# 去处理 —— 当前 location 没有 fastcgi，于是静态模块把 index.php 当普通文件吐出来，
# 浏览器下载到的是 PHP 源码（Content-Type: application/octet-stream）。
# rewrite 的 "^/$" 是整串匹配，替换后正好是 /index.php（不会多出尾巴斜杠），
# 且 last 会重新选 location，落到 location ~ \.php$ 上交给 PHP。
location = / {
    rewrite "^/$" /index.php last;
}

location ~ "^/(tracked|planned|done|all)/task/([0-9]+)/([0-9]{4}-[0-9]{2}-[0-9]{2})/?$" {
    rewrite "^/(tracked|planned|done|all)/task/([0-9]+)/([0-9]{4}-[0-9]{2}-[0-9]{2})/?$" /index.php?tab=$1&task=$2&date=$3 last;
}

location ~ "^/(tracked|planned|done|all)/task/([0-9]+)/?$" {
    rewrite "^/(tracked|planned|done|all)/task/([0-9]+)/?$" /index.php?tab=$1&task=$2 last;
}

location ~ "^/(tracked|planned|done|all)/?$" {
    rewrite "^/(tracked|planned|done|all)/?$" /index.php?tab=$1 last;
}

location ~ "^/admin/tasks/([0-9]+)/?$" {
    rewrite "^/admin/tasks/([0-9]+)/?$" /admin.php?view=tasks&edit=$1 last;
}

location ~ "^/admin/(tasks|categories|system)/?$" {
    rewrite "^/admin/(tasks|categories|system)/?$" /admin.php?view=$1 last;
}

location ~ "^/admin/?$" {
    rewrite "^/admin/?$" /admin.php?view=tasks last;
}

location ~ "^/login/?$" {
    rewrite "^/login/?$" /login.php last;
}

location ~ "^/logout/?$" {
    rewrite "^/logout/?$" /logout.php last;
}

location ~ "^/action/?$" {
    rewrite "^/action/?$" /action.php last;
}

# --- 兜底 -------------------------------------------------------------------
# 不写 location / ：面板的站点配置里通常已经有一个（try_files ... /index.php），
# 再写一个会报 duplicate location /。没匹配到的地址由 nginx 默认 404 挡掉，
# 目录列表同样开不了。
